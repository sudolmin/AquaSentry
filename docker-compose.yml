services:
  water-dashboard:
    build: .
    container_name: water-dashboard
    restart: unless-stopped
    ports:
      - "7777:8080"
    environment:
      - MQTT_HOST=host.docker.internal
      - MQTT_PORT=1883
      - APP_PORT=8080
      - TANK_DB_PATH=/data/tank.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - tank-data:/data

volumes:
  tank-data:
